name: SIM Anywhere
options:
  bundleIdPrefix: net.janlay
  deploymentTarget:
    iOS: "18.0"
  developmentLanguage: zh-Hans
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  SIMAnywhere:
    type: application
    platform: iOS
    sources: [App/Shared, App/iOS]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.janlay.SIMAnywhere
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: SIM Anywhere
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: 访问局域网内 OpenWrt 节点上的 SIM Anywhere API。
        INFOPLIST_KEY_NSMicrophoneUsageDescription: 通话时把你的声音经 4G 模组传给对方。
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
    info:
      path: App/iOS/Info.plist
      properties:
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        BGTaskSchedulerPermittedIdentifiers:
          - net.janlay.SIMAnywhere.smscheck
        UIBackgroundModes:
          - fetch
          - audio
          - voip
