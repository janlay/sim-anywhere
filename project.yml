name: SIM Anywhere
options:
  bundleIdPrefix: net.janlay
  deploymentTarget:
    iOS: "18.0"
  developmentLanguage: zh-Hans
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.6"
    CURRENT_PROJECT_VERSION: "6"
    SIM_ANYWHERE_GIT_SHORT_HASH: unknown
    SIM_ANYWHERE_BUNDLE_ID: net.janlay.simanywhere
targets:
  SIMAnywhere:
    type: application
    platform: iOS
    sources: [App/Shared, App/iOS]
    entitlements:
      path: App/iOS/SIMAnywhere.entitlements
      properties:
        aps-environment: $(APS_ENVIRONMENT)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(SIM_ANYWHERE_BUNDLE_ID)
        APS_ENVIRONMENT: development
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: SIM Anywhere
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: 访问局域网内 OpenWrt 节点上的 SIM Anywhere API。
        INFOPLIST_KEY_NSMicrophoneUsageDescription: 通话时把你的声音经 4G 模组传给对方。
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
      configs:
        Release:
          APS_ENVIRONMENT: production
    info:
      path: App/iOS/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        GitShortHash: $(SIM_ANYWHERE_GIT_SHORT_HASH)
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        BGTaskSchedulerPermittedIdentifiers:
          - $(PRODUCT_BUNDLE_IDENTIFIER).smscheck
        UIBackgroundModes:
          - fetch
          - audio
          - voip
